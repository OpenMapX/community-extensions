name: Validate catalog and revocations
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate catalog.json
        run: node scripts/validate-catalog.mjs catalog.json
      - name: Test the revocation validator
        run: node --test scripts/validate-revocations.test.mjs
      - name: Validate revocations.json
        run: node scripts/validate-revocations.mjs revocations.json
